; Apply through your hosting PHP settings / the web-SAPI php.ini, not .user.ini.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
allow_url_include = Off
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
; No public upload feature currently exists.
file_uploads = Off
upload_max_filesize = 5M
post_max_size = 6M
max_file_uploads = 1
memory_limit = 256M
max_execution_time = 60
; Restrict the web worker; CLI Composer, scheduler and deployment need separate settings.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen
; Adapt to the actual app, temp directory and CA certificate locations first.
; open_basedir = /home/USER/domains/DOMAIN:/tmp:/etc/ssl/certs:/etc/pki
; open_basedir and disable_functions are defense in depth, not sandbox boundaries.
