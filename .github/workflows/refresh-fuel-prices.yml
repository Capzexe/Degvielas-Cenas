name: Refresh fuel prices

on:
  schedule:
    # Every six hours. GitHub Actions schedules use UTC.
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: fuel-price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure Hostinger SSH access
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          # GitHub secrets pasted from Windows can retain CRLF line endings,
          # which OpenSSH on the Linux runner cannot read as a private key.
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -lf ~/.ssh/id_ed25519
          ssh-keyscan -p 65002 -H 46.17.175.181 >> ~/.ssh/known_hosts

      - name: Import current fuel prices
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p 65002 \
            u522832521@46.17.175.181 \
            'cd /home/u522832521/domains/olivedrab-falcon-903315.hostingersite.com && php artisan fetch:fuel-prices'
